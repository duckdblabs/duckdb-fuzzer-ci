name: AFL++ Fuzz DuckDB File Readers
on:
  workflow_dispatch:
    inputs:
      csv:
        description: Fuzz CSV inputs
        type: boolean
        default: true
      json:
        description: Fuzz JSON inputs
        type: boolean
        default: true
      parquet:
        description: Fuzz Parquet inputs
        type: boolean
        default: true
      duckdbRepo:
        description: duckdb repository
        type: string
        default: duckdb/duckdb
      duckdb_ref:
        description: duckdb branch, tag, or full-length SHA
        type: string
        default: main
      fuzzTime:
        description: fuzz time (seconds)
        type: number
        default: 1200

jobs:
  run-file-reader-fuzzer:
    name: Run AFL++ File Reader Fuzzer
    # TODO: once parallel-ci-build is merged, update both refs below to main
    uses: duckdblabs/duckdb-aflplusplus/.github/workflows/FileReaderFuzzer.yml@parallel-ci-build
    with:
      csv: ${{ inputs.csv }}
      json: ${{ inputs.json }}
      parquet: ${{ inputs.parquet }}
      duckdbRepo: ${{ inputs.duckdbRepo }}
      duckdb_ref: ${{ inputs.duckdb_ref }}
      duckdb_aflplusplus_ref: parallel-ci-build  # TODO: move to main (see above)
      fuzzTime: ${{ inputs.fuzzTime }}
    secrets:
      FUZZEROFDUCKSKEY: ${{ secrets.FUZZEROFDUCKSKEY }}
